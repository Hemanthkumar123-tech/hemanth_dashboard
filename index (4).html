<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Desk Live Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mut:#6b7686;--line:#e3e7ee;--acc:#0f6fde;--ok:#14883c;--bad:#c8312b;--warn:#b9770e;--okbg:#e5f5ea;--badbg:#fdeaea;--warnbg:#fdf3df;--edit:#fff8d6}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#171e28;--ink:#e6ebf2;--mut:#93a0b3;--line:#27313f;--acc:#5aa2ff;--ok:#4cc27a;--bad:#ff7a73;--warn:#e8b04a;--okbg:#14301f;--badbg:#3a1a1a;--warnbg:#3a2e14;--edit:#3a3414}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650}.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:p 2s infinite}.dot.off{background:var(--bad)}
@keyframes p{70%{box-shadow:0 0 0 7px transparent}}
.sp{flex:1}.mut{color:var(--mut)}small{font-size:12px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:16px;max-width:1500px;margin:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile b{display:block;font-size:22px;font-weight:650}.tile span{color:var(--mut);font-size:12px}
.tile.bad b{color:var(--bad)}.tile.ok b{color:var(--ok)}.tile.warn b{color:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer}.tab.act{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=search],input[type=text],input[type=password]{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;z-index:1}
td.ed{cursor:text}td.ed:hover{background:var(--edit)}td.busy{background:var(--warnbg)}td.flash{animation:f 1.6s}@keyframes f{from{background:var(--edit)}}
td input.cell{width:100%;min-width:140px;font:inherit;padding:2px 4px;border:1px solid var(--acc);border-radius:4px;background:var(--card);color:var(--ink)}
.pill{padding:1px 8px;border-radius:99px;font-size:12px;background:var(--line)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}#toast.show{opacity:1}
#login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}#login label{display:block;margin:10px 0 3px;color:var(--mut);font-size:12px}#login input{width:100%}
.err{color:var(--bad);margin-top:8px}.hide{display:none!important}.x{color:var(--bad);cursor:pointer;border:0;background:none;padding:0 4px}
@media(max-width:640px){main{padding:10px}th,td{padding:6px}}
</style></head><body>
<div id="login" class="hide"><h1>AR Desk Live Dashboard</h1><p class="mut">Sign in once; this browser remembers it.</p>
<label>Apps Script web app URL (ends with /exec)</label><input id="lu" type="text" placeholder="https://script.google.com/macros/s/.../exec">
<label>Dashboard password</label><input id="lp" type="password"><p><button class="pri" id="lgo">Open dashboard</button></p><div class="err" id="lerr"></div></div>

<div id="app" class="hide">
<header><h1>AR Desk Live Dashboard</h1><span><span class="dot" id="dot"></span><span id="sync" class="mut">connecting…</span></span>
<span class="sp"></span><span id="role" class="pill"></span><button id="rf">Refresh now</button><button id="out">Sign out</button></header>
<main><div class="tiles" id="tiles"></div>
<div class="tabs" id="tabs"></div>
<div class="tabs"><input type="search" id="q" placeholder="Search this sheet…" size="28"><span class="mut" id="cnt"></span><span class="sp"></span><button id="add" class="hide">+ Add row</button></div>
<div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<p class="mut"><small>Click a cell to edit, Enter to save, Esc to cancel. Changes go straight into the Google Sheet; changes made in the sheet appear here within seconds. Log and Outbox are read-only (latest 200 rows).</small></p></main></div>
<div id="toast"></div>
<script>
const DEFAULT_URL="";            // optional: put your /exec URL here so people only type the password
const POLL_MS=6000, POLL_HIDDEN_MS=30000;
let cfg={url:"",pw:""},snap=null,ver="",tab="Routes",filter="",editing=null,pending={},timer=null,failing=0;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=3200){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),ms)}
async function api(params){const u=cfg.url+(cfg.url.includes("?")?"&":"?")+new URLSearchParams(Object.assign({action:"dash",secret:cfg.pw},params));
  const r=await fetch(u,{redirect:"follow"});return r.json()}
async function write(body){const r=await fetch(cfg.url+"?action=dash",{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({secret:cfg.pw},body))});return r.json()}

async function login(){cfg.url=$("lu").value.trim();cfg.pw=$("lp").value;$("lerr").textContent="";
  try{const d=await api({});if(!d.ok){$("lerr").textContent=d.error||"Login failed";return}
    store.set("dash_url",cfg.url);store.set("dash_pw",cfg.pw);start(d)}catch(e){$("lerr").textContent="Cannot reach the web app. Check the URL and that it is deployed for 'Anyone'."}}
function start(first){$("login").classList.add("hide");$("app").classList.remove("hide");apply(first);schedule()}
function schedule(){clearTimeout(timer);timer=setTimeout(poll,document.hidden?POLL_HIDDEN_MS:POLL_MS)}
async function poll(force){
  try{const d=await api(force?{}:{since:ver});failing=0;
    if(!d.ok){if(/Unauthorized/.test(d.error)){signout();return}throw new Error(d.error)}
    if(d.unchanged){snap&&(snap.status=d.status);header(d)}else apply(d)}
  catch(e){failing++;$("dot").className="dot off";$("sync").textContent="offline – retrying ("+(e.message||"network")+")"}
  schedule()}
function apply(d){snap=d;ver=d.version;header(d);tiles();tabs();if(!editing)render()}
function header(d){$("dot").className="dot on";$("sync").textContent="live · updated "+new Date().toLocaleTimeString();
  $("role").textContent=snap.role==="edit"?"can edit":"view only";$("role").className="pill "+(snap.role==="edit"?"ok":"warn");tiles()}
function tiles(){if(!snap)return;const ob=(snap.status&&snap.status.outbox)||{},ago=snap.status&&snap.status.lastBridgePollSecondsAgo,m=snap.mode||{};
  const routes=snap.sheets.Routes?snap.sheets.Routes.rows:[];const act=routes.filter(r=>!/^n/i.test(String(r.v[3]||""))).length;
  const noGroup=routes.filter(r=>!/^\d+@g\.us$/.test(String(r.v[2]||"").trim())).length;
  const cs=snap.sheets.ChatSpaces?snap.sheets.ChatSpaces.rows.filter(r=>r.v[3]===true).length:0;
  const T=(n,v,c)=>`<div class="tile ${c||""}"><b>${esc(v)}</b><span>${n}</span></div>`;
  const bridge=ago==null?T("Bridge","never","bad"):T("Bridge last poll",ago+"s ago",ago>120?"bad":"ok");
  $("tiles").innerHTML=bridge+T("Forwarding mode",m.MODE||"-",m.MODE==="LIVE"?"ok":"warn")+T("KMCH mode",m.KMCH_MODE||"-")+T("Chat relay mode",m.CHATRELAY_MODE||"-")+
   T("Sent (recent)",ob.SENT||0,"ok")+T("Pending",(ob.PENDING||0)+(ob.LEASED||0),(ob.PENDING||0)>5?"warn":"")+T("Failed / expired",(ob.FAILED||0)+(ob.EXPIRED||0),(ob.FAILED||0)?"bad":"")+
   T("Active clients",act+" / "+routes.length)+T("Clients w/o group",noGroup,noGroup?"warn":"ok")+T("Chat spaces enabled",cs)}
function tabs(){const names=Object.keys(snap.sheets);if(!names.includes(tab))tab=names[0];
  $("tabs").innerHTML=names.map(n=>`<span class="tab ${n===tab?"act":""}" data-t="${n}">${n} <small>${snap.sheets[n].total}</small></span>`).join("")}
function statusPill(v){const s=String(v);const c=/^(SENT|OK|.*QUEUED.*|MATCHED|LIVE)$/i.test(s)?"ok":/FAIL|ERROR|EXPIRED|MISMATCH|AMBIG|BAD_|NOT_IN|NO_/i.test(s)?"bad":/PENDING|LEASED|TEST|WARN/i.test(s)?"warn":"";return c?`<span class="pill ${c}">${esc(s)}</span>`:esc(s)}
function render(){if(!snap)return;const s=snap.sheets[tab];if(!s)return;const q=filter.toLowerCase();
  const rows=s.rows.filter(r=>!q||r.v.some(x=>String(x).toLowerCase().includes(q)));
  $("cnt").textContent=rows.length+" of "+s.rows.length+" rows";$("add").classList.toggle("hide",!(s.editable&&snap.role==="edit"));
  $("th").innerHTML="<tr>"+s.header.map(h=>"<th>"+esc(h)+"</th>").join("")+(s.editable?"<th></th>":"")+"</tr>";
  $("tb").innerHTML=rows.map(r=>"<tr data-r='"+r.r+"'>"+s.header.map((h,c)=>{const v=r.v[c],edc=s.editable&&c<s.cols,k=tab+"|"+r.r+"|"+(c+1),busy=pending[k]?" busy":"";
    const isBox=tab==="ChatSpaces"&&c===3;
    const inner=isBox?`<input type="checkbox" ${v===true?"checked":""} ${edc?"":"disabled"} data-box="1">`:(!edc&&(tab==="Outbox"||tab==="Log")?statusPill(v):esc(v));
    return `<td class="${edc&&!isBox?"ed":""}${busy}" data-c="${c+1}" title="${esc(v)}">${inner}</td>`}).join("")+(s.editable?`<td><button class="x" data-del="1" title="Delete row">✕</button></td>`:"")+"</tr>").join("")}
document.addEventListener("click",async e=>{
  const t=e.target.closest(".tab");if(t){tab=t.dataset.t;editing=null;tabs();render();return}
  const del=e.target.closest("[data-del]");if(del){const tr=del.closest("tr"),row=+tr.dataset.r;const first=snap.sheets[tab].rows.find(r=>r.r===row);
    if(!confirm("Delete this row ("+(first?first.v[0]:"")+") from the Google Sheet?"))return;
    const d=await write({op:"delete",sheet:tab,row,expect:String(first.v[0])});d.ok?toast("Row deleted"):toast(d.error);poll(true);return}
  const td=e.target.closest("td.ed");if(td&&!editing&&snap.role==="edit")startEdit(td)});
document.addEventListener("change",async e=>{const b=e.target.closest("[data-box]");if(!b)return;const tr=b.closest("tr"),row=+tr.dataset.r,r=snap.sheets[tab].rows.find(x=>x.r===row);
  await save(tab,row,4,String(r.v[3]),b.checked,b.closest("td"))});
function startEdit(td){const tr=td.closest("tr"),row=+tr.dataset.r,col=+td.dataset.c,r=snap.sheets[tab].rows.find(x=>x.r===row),old=r.v[col-1];
  editing={tab,row,col};td.innerHTML=`<input class="cell" value="${esc(old)}">`;const i=td.firstChild;i.focus();i.select();
  let done=false;const fin=async ok=>{if(done)return;done=true;editing=null;const nv=i.value;
    if(ok&&String(nv)!==String(old))await save(tab,row,col,String(old),nv,td);else render()};
  i.onkeydown=ev=>{if(ev.key==="Enter")fin(true);else if(ev.key==="Escape")fin(false)};i.onblur=()=>fin(true)}
async function save(sh,row,col,old,value,td){const k=sh+"|"+row+"|"+col;pending[k]=1;
  const r=snap.sheets[sh].rows.find(x=>x.r===row);if(r)r.v[col-1]=value;render();      // show it immediately
  try{const d=await write({op:"set",sheet:sh,row,col,old,value});
    if(d.ok)toast("Saved to the sheet",1500);else toast(d.conflict?"Someone changed this cell in the sheet – showing the latest value":(d.error||"Not saved"),4500)}
  catch(e){toast("Could not reach the sheet – not saved",4500)}
  delete pending[k];await poll(true)}
$("add").onclick=async()=>{const s=snap.sheets[tab];const vals=[];for(let i=0;i<s.cols;i++){const v=prompt(s.header[i]+(i===0?" (required)":"")+":","");if(v===null)return;vals.push(v)}
  if(!String(vals[0]).trim()){toast("First column is required");return}const d=await write({op:"append",sheet:tab,values:vals});d.ok?toast("Row added"):toast(d.error);poll(true)};
$("q").oninput=e=>{filter=e.target.value;if(!editing)render()};$("rf").onclick=()=>poll(true);$("lgo").onclick=login;$("lp").onkeydown=e=>{if(e.key==="Enter")login()};
function signout(){store.del("dash_pw");clearTimeout(timer);snap=null;ver="";$("app").classList.add("hide");$("login").classList.remove("hide");$("lp").value=""}
$("out").onclick=signout;document.addEventListener("visibilitychange",()=>{if(!document.hidden&&snap)poll(true)});
(async()=>{cfg.url=store.get("dash_url")||DEFAULT_URL;cfg.pw=store.get("dash_pw");$("lu").value=cfg.url;
  if(cfg.url&&cfg.pw){try{const d=await api({});if(d.ok){start(d);return}}catch(e){}}
  $("login").classList.remove("hide")})();
</script></body></html>
